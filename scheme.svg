<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400"
     viewBox="0 0 800 400"
     xmlns="http://www.w3.org/2000/svg"
     style="background-color: #f8f8f8;">

  <!-- Определяем стрелку для линий-наследований -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,10 L10,5 Z" fill="black" />
    </marker>
  </defs>

  <!-- Прямоугольник (Shape) -->
  <rect x="240" y="20" width="120" height="40" fill="#ffffff" stroke="#000000"/>
  <text x="300" y="45" text-anchor="middle" font-family="Verdana" font-size="14">
    shape
  </text>

  <!-- Прямоугольник (line) -->
  <rect x="60" y="120" width="80" height="40" fill="#ffffff" stroke="#000000"/>
  <text x="100" y="145" text-anchor="middle" font-family="Verdana" font-size="14">
    line
  </text>

  <!-- Прямоугольник (diagonal_cross) -->
  <rect x="240" y="120" width="120" height="40" fill="#ffffff" stroke="#000000"/>
  <text x="300" y="145" text-anchor="middle" font-family="Verdana" font-size="14">
    diagonal_cross
  </text>

  <!-- Прямоугольник (rotatable) -->
  <rect x="420" y="120" width="100" height="40" fill="#ffffff" stroke="#000000"/>
  <text x="470" y="145" text-anchor="middle" font-family="Verdana" font-size="14">
    rotatable
  </text>

  <!-- Прямоугольник (reflectable) -->
  <rect x="540" y="120" width="100" height="40" fill="#ffffff" stroke="#000000"/>
  <text x="590" y="145" text-anchor="middle" font-family="Verdana" font-size="14">
    reflectable
  </text>

  <!-- Прямоугольник (rectangle) -->
  <rect x="450" y="220" width="80" height="40" fill="#ffffff" stroke="#000000"/>
  <text x="490" y="245" text-anchor="middle" font-family="Verdana" font-size="14">
    rectangle
  </text>

  <!-- Линии-наследования (стрелки) -->
  <!-- shape -->
  <line x1="300" y1="60" x2="100" y2="120" stroke="black" stroke-width="1"
        marker-end="url(#arrow)" />
  <line x1="300" y1="60" x2="300" y2="120" stroke="black" stroke-width="1"
        marker-end="url(#arrow)" />
  <line x1="300" y1="60" x2="470" y2="120" stroke="black" stroke-width="1"
        marker-end="url(#arrow)" />
  <line x1="300" y1="60" x2="590" y2="120" stroke="black" stroke-width="1"
        marker-end="url(#arrow)" />

  <!-- rotatable -> rectangle -->
  <line x1="470" y1="160" x2="490" y2="220" stroke="black" stroke-width="1"
        marker-end="url(#arrow)" />

</svg>
